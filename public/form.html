<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
  </head>
  <body>
    <!-- 회원가입폼 -->
    <div class="join_form">
      <h2>회원가입</h2>
      <form action="member_join.jsp" method="get">
        <!-- 기본정보창 -->
        <fieldset>
          <legend>기본정보</legend>
          <label for="userid">아이디</label>
          <input
            id="userid"
            name="userid"
            type="text"
            minlength="8"
            maxlength="16"
            required
          />
          <button>아이디 중복확인</button>
          <br />
          <label for="pass">비밀번호</label>
          <input
            id="pass"
            name="pass"
            type="password"
            minlength="8"
            maxlength="16"
            required
          />
          <label for="pass2">비밀번호 확인</label>
          <input
            id="pass2"
            name="pass2"
            type="password"
            minlength="8"
            maxlength="10"
            required
          />
          <br />
          <label>이름</label>
          <input type="text" name="name" required />
          <br />
          <label>이메일</label>
          <input type="email" name="email" required />
          <br />
          <label>성별</label>
          <input type="radio" name="gender" value="1" checked />남성
          <input type="radio" name="gender" value="2" />여성
          <br />
          <label>생년월일</label>
          <input type="date" name="birthday" />
          <br />
          <br />
          <label>이용약관</label>
          <br />
          <textarea readonly>우하하하하하하핳하하 우하하하하하하</textarea>
          <br />
          <label>이용약관 동의</label>
          <input type="checkbox" name="agree" />
          <br />
          <br />
          <label>파일(5M이하만 돼요)</label>
          <br />
          <input type="file" name="file" />
        </fieldset>
        <!-- 부가정보창 -->
        <fieldset>
          <legend>부가정보</legend>
          <label>지역</label>
          <select name="city">
            <option value="dg">대구</option>
            <option value="se">서울</option>
          </select>
        </fieldset>
        <!-- 버튼 -->
        <fieldset>
          <input type="reset" value="재작성" />
          <input type="submit" value="회원가입" />
        </fieldset>
      </form>
    </div>
  </body>
</html>
